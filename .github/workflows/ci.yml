name: MP172 CI Pipeline

on:
  push:
    branches:
      - main
      - stage3-rajvansh
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scikit-learn mlflow fastapi uvicorn pytest httpx skops threadpoolctl pyyaml

      - name: Run unit tests
        run: python -m pytest tests/ -v